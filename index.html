<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다도 기록장</title>

<!-- 구글 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Yeon+Sung&family=Dokdo&display=swap" rel="stylesheet">

<!-- html2canvas 라이브러리 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --bg:#f6f3ee;
    --card:#ffffff;
    --border:#e2ddd2;
    --border-strong:#c9c1b0;
    --text:#2c2a24;
    --text-sub:#797365;
    --text-muted:#a39c8c;
    --accent:#6b7a4f;
    --accent-bg:#eef1e6;
    --accent-text:#4a5636;
    --danger:#b5533f;
    --radius:10px;
    --font-selected: 'Noto Sans KR', sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    min-width: 0;
  }

  body, input, select, textarea, button, span, label, div, p, h1, h2, h3 {
    font-family: var(--font-selected) !important;
  }

  input, textarea, select {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    font-family: var(--font-selected) !important;
  }

  ::placeholder {
    font-family: var(--font-selected) !important;
    opacity: 0.6;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    padding-bottom:60px;
  }
  header{
    padding:20px 16px 12px;
    text-align:center;
  }
  header h1{
    font-size:28px;
    font-weight:700;
    margin:0 0 2px;
  }
  header p{
    font-size:12px;
    color:var(--text-sub);
    margin:0;
  }
  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:0 14px;
  }

  #capture-area {
    width: 100%;
    background: var(--bg);
    padding: 10px;
    border-radius: 12px;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
  }
  .section-title{
    font-size:14px;
    font-weight:600;
    color:var(--text-sub);
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .row{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-bottom:12px;
  }
  .row.two{
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  }
  label{
    font-size:12px;
    color:var(--text-muted);
    display:block;
    margin-bottom:4px;
  }
  input[type=text], input[type=date], select, textarea{
    width:100%;
    max-width:100%;
    height:38px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    padding:0 10px;
    font-size:14px;
    background:#fff;
    color:var(--text);
  }
  textarea{
    height:70px;
    padding:8px 10px;
    resize:vertical;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23797365' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    padding-right:28px;
  }
  input[type=date]{
    font-size:13px;
  }
  .chip-group{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .chip{
    position:relative;
  }
  .chip input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    margin:0;
    cursor:pointer;
  }
  .chip span{
    display:inline-block;
    padding:6px 12px;
    font-size:12.5px;
    border:1px solid var(--border-strong);
    border-radius:20px;
    color:var(--text-sub);
    background:#fff;
    transition:.12s;
  }
  .chip input:checked + span{
    background:var(--accent-bg);
    border-color:var(--accent);
    color:var(--accent-text);
    font-weight:600;
  }
  .slider-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  input[type=range]{
    flex:1;
    height:6px;
    border-radius:4px;
    outline:none;
    background: var(--border-strong);
  }
  .slider-val{
    font-size:13px;
    font-weight:600;
    min-width:16px;
    text-align:center;
    color:var(--accent-text);
  }
  .divider{
    border-top:1px solid var(--border);
    margin:14px 0;
  }
  
  /* 탕색 팔레트 */
  .color-swatches{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .swatch{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid #fff;
    outline:1px solid var(--border-strong);
    cursor:pointer;
  }
  .color-custom-row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .color-picker-wrap{
    position:relative;
    width:38px;
    height:38px;
    flex:none;
  }
  .color-preview{
    position:absolute;
    inset:0;
    border-radius:50%;
    outline:1px solid var(--border-strong);
    background-color: #e8b04b;
  }
  .color-picker-wrap input[type=color]{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    opacity:0;
    cursor:pointer;
  }

  /* 별점 (하트) */
  .heart-row{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .heart{
    font-size:26px;
    line-height:1;
    cursor:pointer;
    color:#e2ddd2;
    user-select:none;
  }
  .heart.active{
    color:var(--danger) !important;
  }

  /* 버튼 영역 */
  button.save{
    width:100%;
    height:44px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .capture-btn{
    width:100%;
    height:40px;
    border:1px solid var(--border-strong);
    border-radius:10px;
    background:#fff;
    color:var(--text-sub);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }

  /* 지난 기록 리스트 */
  .entry{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
  }
  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:8px;
  }
  .entry-title{
    font-size:14.5px;
    font-weight:600;
  }
  .entry-sub{
    font-size:12px;
    color:var(--text-muted);
    margin-top:2px;
  }
  .entry-user{
    font-size:11px;
    background:var(--accent-bg);
    color:var(--accent-text);
    padding:2px 8px;
    border-radius:10px;
    font-weight:600;
  }
  .entry-tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin:6px 0;
  }
  .tag{
    font-size:11px;
    padding:3px 8px;
    border-radius:20px;
    background:#f1efe8;
    color:var(--text-sub);
  }
  .entry-grid{
    font-size:12.5px;
    color:var(--text-sub);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px 10px;
    margin:8px 0;
  }
  .entry-note{
    font-size:13px;
    color:var(--text);
    margin-top:6px;
    white-space:pre-wrap;
    line-height:1.5;
  }
  .del-btn{
    border:none;
    background:none;
    color:var(--text-muted);
    font-size:12px;
    cursor:pointer;
  }
  .empty{
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    padding:30px 0;
  }
  .err{
    color:var(--danger);
    font-size:12px;
    margin-top:-4px;
    margin-bottom:10px;
    display:none;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    background:var(--text);
    color:#fff;
    font-size:13px;
    padding:10px 18px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:9999;
  }
  .toast.show{opacity:1;}

  /* 팝업 모달 */
  .modal-overlay{
    position:fixed;
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:10000;
    padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-content{
    background:#fff;
    border-radius:14px;
    max-width:420px;
    width:100%;
    max-height:85vh;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-y:auto;
  }
  .modal-content img{
    width:100%;
    height:auto;
    border-radius:8px;
    border:1px solid var(--border);
    object-fit:contain;
  }
  .modal-tip{
    font-size:13px;
    color:var(--accent-text);
    margin:12px 0 8px;
    font-weight:600;
    text-align:center;
  }
  .modal-close-btn{
    width:100%;
    height:38px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>🍵 다도 기록장</h1>
  <p>매번 우린 차의 인상을 기록해요</p>
</header>

<div class="wrap">
  <div class="card">
    <label>글꼴 선택</label>
    <select id="font-select">
      <option value="'Noto Sans KR', sans-serif">기본체 (Noto Sans)</option>
      <option value="'Gaegu', cursive">개구쟁이체 (Gaegu)</option>
      <option value="'Yeon Sung', cursive">연성체 (Yeon Sung)</option>
      <option value="'Gamja Flower', cursive">감자꽃체 (Gamja Flower)</option>
      <option value="'Dokdo', cursive">독도체 (Dokdo)</option>
      <option value="'Gowun Batang', serif">고운바탕체 (Gowun Batang)</option>
    </select>
  </div>

  <div id="capture-area">
    <div class="card">
      <p class="section-title">기본 정보</p>
      <div class="row two">
        <div>
          <label>작성자</label>
          <input type="text" id="f-user" placeholder="이름 또는 닉네임">
        </div>
        <div>
          <label>날짜</label>
          <input type="date" id="f-date">
        </div>
      </div>
      <div class="row two">
        <div>
          <label>차 종류</label>
          <select id="f-type">
            <option value="">선택</option>
            <option>녹차</option>
            <option>백차</option>
            <option>황차</option>
            <option>청차(우롱차)</option>
            <option>홍차</option>
            <option>흑차(보이차)</option>
            <option>화차</option>
            <option>기타</option>
          </select>
        </div>
        <div>
          <label>차 브랜드</label>
          <input type="text" id="f-brand" placeholder="예: OO다원">
        </div>
      </div>
      <div class="err" id="err-basic">작성자, 날짜, 차 종류는 필수예요.</div>
    </div>

    <div class="card">
      <p class="section-title">탕색</p>
      <div class="row">
        <div>
          <div class="color-swatches" id="color-swatches"></div>
          <div class="color-custom-row">
            <div class="color-picker-wrap">
              <div class="color-preview" id="f-color-preview"></div>
              <input type="color" id="f-color-picker" value="#e8b04b">
            </div>
            <input type="text" id="f-color-label" placeholder="색상 이름 (예: 밝은 등황색)">
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <p class="section-title">엽저</p>
      <input type="text" id="f-yeopjeo" placeholder="예: 균일한 갈색">
    </div>

    <div class="card">
      <p class="section-title">향 (다중 선택)</p>
      <div class="chip-group" id="group-aroma">
        <label class="chip"><input type="checkbox" value="청향"><span>청향</span></label>
        <label class="chip"><input type="checkbox" value="밀향"><span>밀향</span></label>
        <label class="chip"><input type="checkbox" value="화향"><span>화향</span></label>
        <label class="chip"><input type="checkbox" value="과소향"><span>과소향</span></label>
        <label class="chip"><input type="checkbox" value="연향"><span>연향</span></label>
        <label class="chip"><input type="checkbox" value="침향"><span>침향</span></label>
        <label class="chip"><input type="checkbox" value="당향"><span>당향</span></label>
        <label class="chip"><input type="checkbox" value="초당향"><span>초당향</span></label>
        <label class="chip"><input type="checkbox" value="진향"><span>진향</span></label>
      </div>

      <div class="divider"></div>

      <p class="section-title">향 지속성</p>
      <div class="slider-row">
        <input type="range" id="f-aroma-persistence" min="1" max="5" step="1" value="1">
        <span class="slider-val" id="f-aroma-persistence-val">1</span>
      </div>

      <div class="divider"></div>

      <p class="section-title">맛 (다중 선택)</p>
      <div class="chip-group" id="group-taste">
        <label class="chip"><input type="checkbox" value="단맛"><span>단맛</span></label>
        <label class="chip"><input type="checkbox" value="쓴맛"><span>쓴맛</span></label>
        <label class="chip"><input type="checkbox" value="신맛"><span>신맛</span></label>
        <label class="chip"><input type="checkbox" value="감칠맛"><span>감칠맛</span></label>
      </div>

      <div class="divider"></div>

      <p class="section-title">질감</p>
      <input type="text" id="f-texture" placeholder="예: 부드러움">

      <div class="divider"></div>

      <p class="section-title">여운(회감)</p>
      <input type="text" id="f-aftertaste" placeholder="예: 오래 지속됨">

      <div class="divider"></div>

      <p class="section-title">떫은 정도</p>
      <div class="slider-row">
        <input type="range" id="f-astringency" min="1" max="5" step="1" value="1">
        <span class="slider-val" id="f-astringency-val">1</span>
      </div>
    </div>

    <div class="card">
      <p class="section-title">총평 / 메모</p>
      <label style="margin-bottom:6px;">별점</label>
      <div class="heart-row" id="rating-row">
        <span class="heart" data-val="1">♥</span>
        <span class="heart" data-val="2">♥</span>
        <span class="heart" data-val="3">♥</span>
        <span class="heart" data-val="4">♥</span>
        <span class="heart" data-val="5">♥</span>
      </div>
      <textarea id="f-note" placeholder="전반적인 인상, 재구매 의사 등"></textarea>
    </div>
  </div>

  <button type="button" class="capture-btn" id="btn-capture">📷 작성 화면 캡처하기</button>
  <button type="button" class="save" id="btn-save">기록 저장하기</button>

  <div class="divider" style="margin-top:22px;"></div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin:18px 0 10px;">
    <p class="section-title" style="margin:0;">지난 기록</p>
    <select id="filter-user" style="width:130px;">
      <option value="all">전체 보기</option>
    </select>
  </div>

  <div id="entry-list"></div>
</div>

<!-- 캡처 결과 팝업 -->
<div class="modal-overlay" id="modal-capture">
  <div class="modal-content">
    <img id="captured-img" src="" alt="캡처 이미지">
    <div class="modal-tip">💡 이미지를 꾹 길게 눌러 [사진에 저장]을 누르세요!</div>
    <button type="button" class="modal-close-btn" id="modal-close">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// 폰트 설정
const fontSelect = document.getElementById('font-select');
fontSelect.addEventListener('change', (e)=>{
  document.documentElement.style.setProperty('--font-selected', e.target.value);
});

// 기본 날짜 설정
document.getElementById('f-date').valueAsDate = new Date();

// 슬라이더 지표 연동
const sliderAroma = document.getElementById('f-aroma-persistence');
const sliderAromaVal = document.getElementById('f-aroma-persistence-val');
sliderAroma.addEventListener('input', () => sliderAromaVal.textContent = sliderAroma.value);

const sliderAst = document.getElementById('f-astringency');
const sliderAstVal = document.getElementById('f-astringency-val');
sliderAst.addEventListener('input', () => sliderAstVal.textContent = sliderAst.value);

// 탕색 8종 팔레트
const COLOR_PRESETS = [
  {name:'연한 미황색', hex:'#f4ecc8'},
  {name:'밝은 등황색', hex:'#e8b04b'},
  {name:'진한 황금색', hex:'#d69a1f'},
  {name:'귤색', hex:'#e07a2c'},
  {name:'적갈색', hex:'#a85a2b'},
  {name:'진한 홍색', hex:'#8c3b2e'},
  {name:'밤색(흑차)', hex:'#5c3a21'},
  {name:'연두빛 녹색', hex:'#a9b96a'}
];

const swatchWrap = document.getElementById('color-swatches');
const colorPicker = document.getElementById('f-color-picker');
const colorLabel = document.getElementById('f-color-label');
const colorPreview = document.getElementById('f-color-preview');

function updateColor(hex, name = ''){
  colorPicker.value = hex;
  colorPreview.style.backgroundColor = hex;
  if(name) colorLabel.value = name;
}

COLOR_PRESETS.forEach(c => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'swatch';
  b.style.backgroundColor = c.hex;
  b.addEventListener('click', () => updateColor(c.hex, c.name));
  swatchWrap.appendChild(b);
});
colorPicker.addEventListener('input', (e) => updateColor(e.target.value));

// 별점(하트) 정밀 상태
let currentRating = 0;
const heartEls = Array.from(document.querySelectorAll('#rating-row .heart'));

heartEls.forEach(h => {
  h.addEventListener('click', () => {
    const v = Number(h.dataset.val);
    currentRating = (currentRating === v) ? 0 : v;
    heartEls.forEach(el => {
      if (Number(el.dataset.val) <= currentRating) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });
  });
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 1800);
}

// 기록 저장 / 로컬스토리지 관리
const STORAGE_KEY = 'dado_records_v1';
function getRecords(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch(e) { return []; }
}
function saveRecords(arr){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

function renderRecords(){
  const listEl = document.getElementById('entry-list');
  const filterVal = document.getElementById('filter-user').value;
  const records = getRecords();

  // 작성자 필터 옵션 업데이트
  const filterSelect = document.getElementById('filter-user');
  const users = Array.from(new Set(records.map(r => r.user))).filter(Boolean);
  filterSelect.innerHTML = '<option value="all">전체 보기</option>';
  users.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u;
    opt.textContent = u;
    if(u === filterVal) opt.selected = true;
    filterSelect.appendChild(opt);
  });

  const filtered = (filterVal === 'all') ? records : records.filter(r => r.user === filterVal);

  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty">아직 기록이 없어요. 위에서 첫 기록을 남겨보세요.</div>';
    return;
  }

  listEl.innerHTML = filtered.map((r, i) => {
    const heartsStr = '♥'.repeat(r.rating) + '♡'.repeat(5 - r.rating);
    const aromas = r.aromas.map(a => `<span class="tag">#${a}</span>`).join(' ');
    const tastes = r.tastes.map(t => `<span class="tag">#${t}</span>`).join(' ');

    return `
      <div class="entry">
        <div class="entry-top">
          <div>
            <div class="entry-title">${r.type} ${r.brand ? '('+r.brand+')' : ''}</div>
            <div class="entry-sub">${r.date}</div>
          </div>
          <div style="text-align:right;">
            <span class="entry-user">${r.user}</span>
            <br>
            <button class="del-btn" onclick="deleteRecord(${r.id})" style="margin-top:4px;">삭제</button>
          </div>
        </div>
        <div style="color:var(--danger); font-size:13px; margin-bottom:4px;">${heartsStr}</div>
        <div class="entry-tags">${aromas} ${tastes}</div>
        <div class="entry-grid">
          <div>탕색: ${r.colorLabel || r.colorHex}</div>
          <div>엽저: ${r.yeopjeo || '-'}</div>
          <div>향지속성: ${r.aromaPersistence}/5</div>
          <div>떫은정도: ${r.astringency}/5</div>
          <div>질감: ${r.texture || '-'}</div>
          <div>여운: ${r.aftertaste || '-'}</div>
        </div>
        ${r.note ? `<div class="entry-note">${r.note}</div>` : ''}
      </div>
    `;
  }).join('');
}

window.deleteRecord = function(id){
  let records = getRecords();
  records = records.filter(r => r.id !== id);
  saveRecords(records);
  renderRecords();
  showToast('기록이 삭제되었습니다.');
};

document.getElementById('filter-user').addEventListener('change', renderRecords);

document.getElementById('btn-save').addEventListener('click', ()=>{
  const user = document.getElementById('f-user').value.trim();
  const date = document.getElementById('f-date').value;
  const type = document.getElementById('f-type').value;

  const errEl = document.getElementById('err-basic');
  if(!user || !date || !type){
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const aromaBoxes = document.querySelectorAll('#group-aroma input:checked');
  const tasteBoxes = document.querySelectorAll('#group-taste input:checked');

  const newRecord = {
    id: Date.now(),
    user, date, type,
    brand: document.getElementById('f-brand').value.trim(),
    colorHex: colorPicker.value,
    colorLabel: colorLabel.value.trim(),
    yeopjeo: document.getElementById('f-yeopjeo').value.trim(),
    aromas: Array.from(aromaBoxes).map(b => b.value),
    aromaPersistence: sliderAroma.value,
    tastes: Array.from(tasteBoxes).map(b => b.value),
    texture: document.getElementById('f-texture').value.trim(),
    aftertaste: document.getElementById('f-aftertaste').value.trim(),
    astringency: sliderAst.value,
    rating: currentRating,
    note: document.getElementById('f-note').value.trim()
  };

  const records = getRecords();
  records.unshift(newRecord);
  saveRecords(records);
  renderRecords();
  showToast('기록이 저장되었습니다!');
});

// 사파리 / 크롬 공통 100% 폰트 보장 캡처 로직
document.getElementById('btn-capture').addEventListener('click', async ()=>{
  showToast('이미지 생성 중...');
  
  const target = document.getElementById('capture-area');
  const selectedFont = getComputedStyle(document.documentElement).getPropertyValue('--font-selected').trim();

  // DOM을 복제한 뒤 Safari/Chrome 폰트 깨짐 방지를 위해 input/textarea를 html 요소로 치환
  const clone = target.cloneNode(true);
  
  const origInputs = target.querySelectorAll('input, textarea, select');
  const cloneInputs = clone.querySelectorAll('input, textarea, select');

  origInputs.forEach((input, idx) => {
    const cloneInput = cloneInputs[idx];
    if (input.tagName === 'INPUT' || input.tagName === 'TEXTAREA') {
      const val = input.value || input.placeholder || '';
      const div = document.createElement('div');
      div.style.cssText = getComputedStyle(input).cssText;
      div.style.fontFamily = selectedFont;
      div.style.display = 'flex';
      div.style.alignItems = 'center';
      div.style.width = '100%';
      div.style.wordBreak = 'break-all';
      div.textContent = val;
      if (!input.value) div.style.opacity = '0.5';
      
      // color 타입 특수 처리
      if (input.type === 'color') {
        div.style.backgroundColor = input.value;
      }
      
      if (cloneInput.parentNode) {
        cloneInput.parentNode.replaceChild(div, cloneInput);
      }
    }
  });

  // 화면 바깥 임시 노드에 추가
  clone.style.position = 'fixed';
  clone.style.left = '-9999px';
  clone.style.top = '0px';
  clone.style.width = target.offsetWidth + 'px';
  document.body.appendChild(clone);

  try {
    await document.fonts.ready;
    await new Promise(r => setTimeout(r, 150)); // Safari rendering buffer

    const canvas = await html2canvas(clone, {
      scale: 2,
      useCORS: true,
      logging: false,
      backgroundColor: '#f6f3ee'
    });

    const img = document.getElementById('captured-img');
    img.src = canvas.toDataURL('image/png');
    document.getElementById('modal-capture').classList.add('show');
  } catch(e) {
    console.error(e);
    showToast('캡처 이미지 생성 실패');
  } finally {
    document.body.removeChild(clone);
  }
});

document.getElementById('modal-close').addEventListener('click', ()=>{
  document.getElementById('modal-capture').classList.remove('show');
});

// 초기화
renderRecords();
</script>
