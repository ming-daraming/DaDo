<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다도 기록장</title>

<!-- 구글 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Yeon+Sung&family=Dokdo&display=swap" rel="stylesheet">

<!-- html2canvas 최신 안정 버전 -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --border: #e2ddd2;
    --border-strong: #c9c1b0;
    --text: #2c2a24;
    --text-sub: #797365;
    --text-muted: #a39c8c;
    --accent: #6b7a4f;
    --accent-bg: #eef1e6;
    --accent-text: #4a5636;
    --danger: #b5533f;
    --font-family: 'Noto Sans KR', sans-serif;
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  body, input, select, textarea, button, span, label, div, p, h1, h2, h3 {
    font-family: var(--font-family) !important;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }

  header {
    padding: 20px 16px 12px;
    text-align: center;
  }
  header h1 { font-size: 26px; margin: 0 0 4px; font-weight: 700; }
  header p { font-size: 13px; color: var(--text-sub); margin: 0; }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 14px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
    margin: 0 0 10px;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .row.two { grid-template-columns: 1fr 1fr; }

  label {
    font-size: 12px;
    color: var(--text-muted);
    display: block;
    margin-bottom: 4px;
  }

  input[type=text], input[type=date], select, textarea {
    width: 100%;
    height: 40px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    padding: 0 10px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }

  textarea {
    height: 70px;
    padding: 8px 10px;
    resize: none;
  }

  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip { position: relative; }
  .chip input {
    position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer;
  }
  .chip span {
    display: inline-block;
    padding: 6px 12px;
    font-size: 12.5px;
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    color: var(--text-sub);
    background: #fff;
  }
  .chip input:checked + span {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  input[type=range] { flex: 1; }
  .slider-val {
    font-size: 13px; font-weight: 700; color: var(--accent-text); min-width: 16px;
  }

  .divider { border-top: 1px solid var(--border); margin: 14px 0; }

  /* 탕색 */
  .color-swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .swatch {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff;
    outline: 1px solid var(--border-strong); cursor: pointer;
  }
  .color-custom-row { display: flex; gap: 8px; align-items: center; }
  .color-preview {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border-strong); background: #e8b04b;
  }

  /* 별점 (하트) */
  .heart-row { display: flex; gap: 8px; margin-top: 4px; }
  .heart {
    font-size: 28px; color: #e2ddd2; cursor: pointer; user-select: none; line-height: 1;
  }
  .heart.active { color: var(--danger) !important; }

  .capture-btn {
    width: 100%; height: 46px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 10px;
  }

  /* 모달 팝업 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; justify-content: center; align-items: center; z-index: 99999;
    padding: 16px;
  }
  .modal-overlay.show { display: flex; }
  .modal-content {
    background: #fff; border-radius: 16px; padding: 16px; max-width: 400px;
    width: 100%; max-height: 90vh; overflow-y: auto; text-align: center;
  }
  .modal-content img {
    width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border);
  }
  .modal-tip {
    font-size: 13px; color: var(--accent-text); margin: 12px 0; font-weight: 700;
  }
  .modal-close {
    width: 100%; height: 40px; background: #2c2a24; color: #fff;
    border: none; border-radius: 10px; font-weight: 700; cursor: pointer;
  }

  /* 캡처 전용 숨겨진 레이아웃 (폰트 완전 보장용) */
  #render-target {
    position: absolute; left: -9999px; top: 0; width: 380px;
    background: var(--bg); padding: 20px; border-radius: 16px;
  }
</style>
</head>
<body>

<header>
  <h1>🍵 다도 기록장</h1>
  <p>오늘 우린 차의 인상을 기록해요</p>
</header>

<div class="wrap">
  <div class="card">
    <label>글꼴 선택</label>
    <select id="font-select">
      <option value="'Noto Sans KR', sans-serif">기본체 (Noto Sans)</option>
      <option value="'Gaegu', cursive">개구쟁이체 (Gaegu)</option>
      <option value="'Yeon Sung', cursive">연성체 (Yeon Sung)</option>
      <option value="'Gamja Flower', cursive">감자꽃체 (Gamja Flower)</option>
      <option value="'Dokdo', cursive">독도체 (Dokdo)</option>
      <option value="'Gowun Batang', serif">고운바탕체 (Gowun Batang)</option>
    </select>
  </div>

  <div class="card">
    <p class="section-title">기본 정보</p>
    <div class="row two">
      <div>
        <label>작성자</label>
        <input type="text" id="f-user" placeholder="이름/닉네임">
      </div>
      <div>
        <label>날짜</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <div class="row two">
      <div>
        <label>차 종류</label>
        <select id="f-type">
          <option value="">선택</option>
          <option>녹차</option><option>백차</option><option>황차</option>
          <option>청차(우롱차)</option><option>홍차</option><option>흑차(보이차)</option>
        </select>
      </div>
      <div>
        <label>차 브랜드</label>
        <input type="text" id="f-brand" placeholder="예: OO다원">
      </div>
    </div>
  </div>

  <div class="card">
    <p class="section-title">탕색 & 엽저</p>
    <div class="color-swatches" id="swatches"></div>
    <div class="color-custom-row">
      <div class="color-preview" id="color-preview"></div>
      <input type="text" id="f-color-name" placeholder="색상 이름 (예: 밝은 등황색)">
    </div>
    <div class="divider"></div>
    <label>엽저</label>
    <input type="text" id="f-yeopjeo" placeholder="예: 균일한 갈색">
  </div>

  <div class="card">
    <p class="section-title">향 & 맛</p>
    <label>향 (다중선택)</label>
    <div class="chip-group" id="group-aroma">
      <label class="chip"><input type="checkbox" value="청향"><span>청향</span></label>
      <label class="chip"><input type="checkbox" value="밀향"><span>밀향</span></label>
      <label class="chip"><input type="checkbox" value="화향"><span>화향</span></label>
      <label class="chip"><input type="checkbox" value="과소향"><span>과소향</span></label>
      <label class="chip"><input type="checkbox" value="진향"><span>진향</span></label>
    </div>
    <div class="divider"></div>
    <label>맛 (다중선택)</label>
    <div class="chip-group" id="group-taste">
      <label class="chip"><input type="checkbox" value="단맛"><span>단맛</span></label>
      <label class="chip"><input type="checkbox" value="쓴맛"><span>쓴맛</span></label>
      <label class="chip"><input type="checkbox" value="신맛"><span>신맛</span></label>
      <label class="chip"><input type="checkbox" value="감칠맛"><span>감칠맛</span></label>
    </div>
    <div class="divider"></div>
    <div class="row two">
      <div>
        <label>질감</label>
        <input type="text" id="f-texture" placeholder="부드러움">
      </div>
      <div>
        <label>여운</label>
        <input type="text" id="f-after" placeholder="길게 남음">
      </div>
    </div>
  </div>

  <div class="card">
    <p class="section-title">총평 / 별점</p>
    <label>별점</label>
    <div class="heart-row" id="heart-row">
      <span class="heart" data-v="1">♥</span>
      <span class="heart" data-v="2">♥</span>
      <span class="heart" data-v="3">♥</span>
      <span class="heart" data-v="4">♥</span>
      <span class="heart" data-v="5">♥</span>
    </div>
    <div class="divider"></div>
    <textarea id="f-note" placeholder="메모를 남겨주세요"></textarea>
  </div>

  <button type="button" class="capture-btn" id="btn-capture">📷 캡처 이미지 만들기</button>
</div>

<!-- 캡처 결과 팝업 -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <img id="result-img" alt="기록장 이미지">
    <div class="modal-tip">💡 이미지를 꾹 눌러 [사진 앱에 저장]하세요!</div>
    <button class="modal-close" id="modal-close">닫기</button>
  </div>
</div>

<!-- 폰트 오염 없는 캡처 렌더링용 숨김 노드 -->
<div id="render-target"></div>

<script>
// 날짜 설정
document.getElementById('f-date').valueAsDate = new Date();

// 폰트 변경
const fontSelect = document.getElementById('font-select');
fontSelect.addEventListener('change', (e)=>{
  document.documentElement.style.setProperty('--font-family', e.target.value);
});

// 탕색 처리
let currentColor = '#e8b04b';
const COLOR_PRESETS = [
  {n:'연한 미황색', c:'#f4ecc8'}, {n:'밝은 등황색', c:'#e8b04b'},
  {n:'진한 황금색', c:'#d69a1f'}, {n:'적갈색', c:'#a85a2b'}, {n:'밤색(흑차)', c:'#5c3a21'}
];
const swatches = document.getElementById('swatches');
COLOR_PRESETS.forEach(p => {
  const b = document.createElement('div');
  b.className = 'swatch';
  b.style.background = p.c;
  b.onclick = () => {
    currentColor = p.c;
    document.getElementById('color-preview').style.background = p.c;
    document.getElementById('f-color-name').value = p.n;
  };
  swatches.appendChild(b);
});

// 하트(별점) 처리
let rating = 0;
const hearts = Array.from(document.querySelectorAll('#heart-row .heart'));
hearts.forEach(h => {
  h.onclick = () => {
    const v = Number(h.dataset.v);
    rating = (rating === v) ? 0 : v;
    hearts.forEach(el => {
      if(Number(el.dataset.v) <= rating) el.classList.add('active');
      else el.classList.remove('active');
    });
  };
});

// Safari & Chrome 완벽 호환 이미지 생성 함수
document.getElementById('btn-capture').onclick = async () => {
  const selectedFont = fontSelect.value;
  const renderTarget = document.getElementById('render-target');
  
  // 선택된 입력 데이터 수집
  const user = document.getElementById('f-user').value || '익명';
  const date = document.getElementById('f-date').value || '';
  const type = document.getElementById('f-type').value || '기타';
  const brand = document.getElementById('f-brand').value || '-';
  const colorName = document.getElementById('f-color-name').value || '지정 안됨';
  const yeopjeo = document.getElementById('f-yeopjeo').value || '-';
  const texture = document.getElementById('f-texture').value || '-';
  const after = document.getElementById('f-after').value || '-';
  const note = document.getElementById('f-note').value || '내용 없음';

  const aromaChecked = Array.from(document.querySelectorAll('#group-aroma input:checked')).map(i=>i.value);
  const tasteChecked = Array.from(document.querySelectorAll('#group-taste input:checked')).map(i=>i.value);

  // 하트 문자열 생성 (활성/비활성 확실 분리)
  let heartHtml = '';
  for(let i=1; i<=5; i++){
    if(i <= rating) heartHtml += `<span style="color:#b5533f; font-size:24px;">♥</span> `;
    else heartHtml += `<span style="color:#e2ddd2; font-size:24px;">♥</span> `;
  }

  // HTML 템플릿 주입 (Input 요소를 Pure Text로 변환하여 사파리/크롬 폰트 미적용 문제 예방)
  renderTarget.style.fontFamily = selectedFont;
  renderTarget.innerHTML = `
    <div style="font-family:${selectedFont}; color:#2c2a24;">
      <h2 style="text-align:center; margin:0 0 12px; font-size:22px; font-family:${selectedFont};">🍵 다도 기록장</h2>
      
      <div style="background:#fff; border:1px solid #e2ddd2; border-radius:12px; padding:12px; margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">
          <span><b>작성자:</b> ${user}</span>
          <span><b>날짜:</b> ${date}</span>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:13px;">
          <span><b>차 종류:</b> ${type}</span>
          <span><b>브랜드:</b> ${brand}</span>
        </div>
      </div>

      <div style="background:#fff; border:1px solid #e2ddd2; border-radius:12px; padding:12px; margin-bottom:10px;">
        <div style="display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px;">
          <b>탕색:</b>
          <span style="display:inline-block; width:16px; height:16px; border-radius:50%; background:${currentColor}; border:1px solid #ccc;"></span>
          <span>${colorName}</span>
        </div>
        <div style="font-size:13px;"><b>엽저:</b> ${yeopjeo}</div>
      </div>

      <div style="background:#fff; border:1px solid #e2ddd2; border-radius:12px; padding:12px; margin-bottom:10px; font-size:13px;">
        <div style="margin-bottom:6px;"><b>향:</b> ${aromaChecked.length ? aromaChecked.join(', ') : '선택 안함'}</div>
        <div style="margin-bottom:6px;"><b>맛:</b> ${tasteChecked.length ? tasteChecked.join(', ') : '선택 안함'}</div>
        <div><b>질감/여운:</b> ${texture} / ${after}</div>
      </div>

      <div style="background:#fff; border:1px solid #e2ddd2; border-radius:12px; padding:12px;">
        <div style="margin-bottom:6px;"><b>별점:</b> ${heartHtml}</div>
        <div style="font-size:13px; white-space:pre-wrap; line-height:1.4;"><b>메모:</b><br>${note}</div>
      </div>
    </div>
  `;

  try {
    // Safari 폰트 렌더링 지연 시간 보장
    await document.fonts.ready;
    await new Promise(res => setTimeout(res, 200));

    const canvas = await html2canvas(renderTarget, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#f6f3ee',
      logging: false
    });

    document.getElementById('result-img').src = canvas.toDataURL('image/png');
    document.getElementById('modal').classList.add('show');
  } catch (err) {
    alert('이미지 생성에 실패했습니다. 다시 시도해 주세요.');
  }
};

document.getElementById('modal-close').onclick = () => {
  document.getElementById('modal').classList.remove('show');
};
</script>

</body>
</html>
